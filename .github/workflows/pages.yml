# Publishes the website in site/ with GitHub Pages.
# One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
# Turn this on only once the release the site describes (with ViolinMIDI-macOS.zip) is published,
# then start this workflow by hand. Until Pages is on, a run stops at configure-pages and publishes nothing.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a waiting one, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deployment are separate jobs, as in GitHub's own starter workflow: in one
  # job the deployment can look for the upload before GitHub lists it, and then fails.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The site is plain HTML, CSS and images: no build step, the folder is uploaded as it is.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
