name: Build VioLogic for macOS

# Every push to main is built and tested.
# A tag like v1.2.0 is built, tested and then published as a release,
# which is where the app's update button looks for new versions.
# The same can be started by hand: Actions > this workflow > "Run workflow" on
# main with "Release" ticked. Then the tag (v + the version in CMakeLists.txt)
# is made here, after everything has passed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Release: publish this version (main only; the tag is created after all tests pass)'
        type: boolean
        default: false

permissions:
  contents: write # the release step attaches the app to the tag

jobs:
  macos:
    name: macOS app (Apple Silicon + Intel)
    runs-on: macos-15
    timeout-minutes: 150  # the shared macOS runners are sometimes several times slower than usual
    env:
      APP: build/app/ViolinMIDI_artefacts/Release/ViolinMIDI.app

    steps:
      - uses: actions/checkout@v7

      - name: Show tools
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Configure (universal binary)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      # As many compile jobs as cores: without a number, make starts all of them at
      # once, the runner (3 cores, 7 GB) runs out of memory and the build takes over an hour.
      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Core tests (Apple Silicon)
        run: ./build/violinmidi_tests

      - name: Core tests (Intel code path, via Rosetta)
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 ./build/violinmidi_tests
          else
            echo "Rosetta is not available on this runner - Intel code path not executed."
          fi

      - name: Check the app bundle
        run: |
          test -d "$APP"
          lipo -archs "$APP/Contents/MacOS/ViolinMIDI"
          lipo -archs "$APP/Contents/MacOS/ViolinMIDI" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/ViolinMIDI" | grep -q x86_64
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Contents/Info.plist"
          # without this text macOS ends the app the moment it asks for the camera
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP/Contents/Info.plist"
          otool -L "$APP/Contents/MacOS/ViolinMIDI" | grep -E "Vision|AVFoundation"
          otool -L "$APP/Contents/MacOS/ViolinMIDI" | grep -q Vision.framework
          /usr/libexec/PlistBuddy -c "Print :NSAppSleepDisabled" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$APP/Contents/Info.plist" | grep -qx VioLogic
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist" | grep -qx app.violinmidi.ViolinMIDI
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist"
          ls "$APP/Contents/Resources"

      - name: Self-test of the app (engine and virtual MIDI port)
        run: '"$APP/Contents/MacOS/ViolinMIDI" --selftest'

      - name: Update mechanism (install, switch versions, fall back)
        run: bash .github/scripts/update-test.sh "$APP"

      # Needs published versions, so it only runs when started by hand:
      # list them, download the newest the way the update button does, unpack and check it.
      - name: Updater against the published versions
        if: github.event_name == 'workflow_dispatch'
        run: |
          BIN="$APP/Contents/MacOS/ViolinMIDI"
          "$BIN" --list-versions
          "$BIN" --fetch-version latest --to "$RUNNER_TEMP/latest.zip"
          rm -rf "$HOME/Library/Application Support/ViolinMIDI/Versions"
          "$BIN" --install-zip "$RUNNER_TEMP/latest.zip"
          ls "$HOME/Library/Application Support/ViolinMIDI/Versions"

      # The one-line installation from the README, also only when started by hand.
      - name: Install script against the published version
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo rm -rf /Applications/VioLogic.app /Applications/Archet.app /Applications/ViolinMIDI.app
          # apps under the earlier names are replaced by the new one
          ditto "$APP" /Applications/ViolinMIDI.app
          ditto "$APP" /Applications/Archet.app
          VIOLINMIDI_NO_OPEN=1 bash install.sh
          test ! -e /Applications/ViolinMIDI.app
          test ! -e /Applications/Archet.app
          /Applications/VioLogic.app/Contents/MacOS/ViolinMIDI --selftest
          # a second run replaces the app that is already there
          VIOLINMIDI_NO_OPEN=1 bash install.sh
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/VioLogic.app/Contents/Info.plist
          # the way it is run by hand: straight from the project page, then started
          sudo rm -rf /Applications/VioLogic.app
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh" | bash
          sleep 6
          pgrep -x ViolinMIDI
          pkill -x ViolinMIDI || true

      - name: Sign (ad hoc) and package
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" ViolinMIDI-macOS.zip
          ls -l ViolinMIDI-macOS.zip
          shasum -a 256 ViolinMIDI-macOS.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ViolinMIDI-macOS
          path: ViolinMIDI-macOS.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # started by hand: only from main, and never over a version that is already out
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::A release can only be started on main (this run is on $GITHUB_REF_NAME)."
              exit 1
            fi
            TAG="v$VERSION"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG is already published. Raise the version in CMakeLists.txt first."
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # the tag and the version built into the app have to agree
          test "v$VERSION" = "$TAG"
          # the notes shown in the app: this version's section of CHANGELOG.md
          awk -v heading="## $VERSION" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          test -s notes.md
          # --target: where a tag that does not exist yet is created (an existing tag stays as it is)
          gh release create "$TAG" ViolinMIDI-macOS.zip --target "$GITHUB_SHA" --title "VioLogic $VERSION" --notes-file notes.md
          # The list of all versions as a plain file. The app reads this instead of
          # the query interface, which limits requests per network address.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq '[.[] | {tag_name, draft, prerelease, published_at, body, assets: [.assets[] | {name, size, digest, browser_download_url}]}]' \
            > versions.json
          jq -e --arg tag "$TAG" 'map(select(.tag_name == $tag and .draft == false)) | length == 1' versions.json
          gh release upload "$TAG" versions.json --clobber
